# Dependabot Configuration
# 
# Automatically checks for dependency updates and creates pull requests.
# Helps keep dependencies secure and up-to-date.

version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    reviewers:
      - "yashw"
    groups:
      # Group React updates together
      react:
        patterns:
          - "react*"
          - "@types/react*"
      # Group development dependencies
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "eslint*"
          - "vite*"
          - "@vitejs/*"
          - "tailwindcss*"
          - "postcss*"
          - "autoprefixer*"
      # Group all other dependencies
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore major version updates for stability
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "github-actions"
