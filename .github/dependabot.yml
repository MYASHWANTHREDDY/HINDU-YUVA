# Dependabot Configuration
# 
# Automatically checks for dependency updates and creates pull requests.
# Helps keep dependencies secure and up-to-date.

version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 15
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    reviewers:
      - "yashw"
    groups:
      # Group React updates together
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-router*"
          - "@types/react*"
      # Group testing dependencies
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "jsdom"
          - "msw"
      # Group linting and formatting
      linting:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "prettier"
          - "husky"
          - "lint-staged"
      # Group build tools
      build:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "tailwindcss*"
          - "@tailwindcss/*"
          - "postcss*"
          - "autoprefixer"
      # Group monitoring and error tracking
      monitoring:
        patterns:
          - "@sentry/*"
          - "zod"
      # Group state management
      state:
        patterns:
          - "zustand"
      # Group all minor and patch updates
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "react*"
          - "@testing-library/*"
          - "vitest*"
          - "eslint*"
          - "vite*"
    # Allow minor and patch updates automatically
    # Only block major updates for review
    ignore:
      # Be cautious with major React updates
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # Block major Firebase updates (breaking changes)
      - dependency-name: "firebase"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "ci"
      - "github-actions"
    groups:
      # Group all GitHub Actions updates
      actions:
        patterns:
          - "*"
